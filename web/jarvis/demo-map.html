<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalLoop — Looper Jarvis Map Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #05070b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #map { position: absolute; inset: 0; }
    /* dark-glass header, matching the live Explore look */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 10px 16px;
      background: linear-gradient(180deg, rgba(5,7,11,.92), rgba(5,7,11,.55) 80%, transparent);
      pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }
    .brand { display: flex; align-items: center; gap: 10px; color: #eaf6ff; font-weight: 800; letter-spacing: -.02em; }
    .brand .dot { width: 12px; height: 12px; border-radius: 999px; background: #56bdff; box-shadow: 0 0 14px rgba(86,189,255,.9); }
    .brand small { font-weight: 600; color: #7ddfff; letter-spacing: .14em; text-transform: uppercase; font-size: 10px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      border: 1px solid rgba(86,189,255,.35); background: rgba(10,12,18,.7); color: #bfe9ff;
      font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 999px; cursor: pointer;
      backdrop-filter: blur(10px); transition: all .15s ease;
    }
    .chip:hover { border-color: rgba(86,189,255,.8); }
    .chip.active { background: #56bdff; color: #04121e; border-color: #56bdff; }
    .hint {
      position: fixed; left: 16px; bottom: 16px; z-index: 20; max-width: 300px;
      background: rgba(10,12,18,.85); border: 1px solid rgba(86,189,255,.3); border-radius: 14px;
      color: #9fb4c8; font-size: 12px; line-height: 1.55; padding: 12px 14px; backdrop-filter: blur(10px);
    }
    .hint strong { color: #dff3ff; }
    .maplibregl-ctrl-attrib { background: rgba(5,7,11,.6) !important; }
    .maplibregl-ctrl-attrib a { color: #7ddfff !important; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>LocalLoop <small>Explore · Jarvis demo</small></span>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="hint">
    <strong>Talk to Looper</strong> (tap the face, Chrome/Safari):
    “find me a café” · “any deals near me” · “take me to Bronte” ·
    “who can help me with my garden” · “zoom in” · “reset the map”.<br>
    Chips fire the <em>same</em> voice grammar. Needs the LOOPER API on
    <code>localhost:8000</code>.
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="voice-command-router.js"></script>
  <script src="looper-map-bus.js"></script>
  <script src="looper-face.js"></script>
  <script src="looper-jarvis.js"></script>
  <script>
    // Bondi Beach home view — same default the master plan uses everywhere.
    var HOME = { lng: 151.2743, lat: -33.8915, zoom: 14.5 };

    var map = new maplibregl.Map({
      container: "map",
      // Free OSM raster tiles: zero keys, real streets — demo only.
      // Production llx11 keeps its own Mapbox style (ADR-0002: tokens via env).
      style: {
        version: 8,
        sources: {
          osm: {
            type: "raster",
            tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
            tileSize: 256,
            attribution: "© OpenStreetMap contributors",
          },
        },
        layers: [
          { id: "bg", type: "background", paint: { "background-color": "#0a0d13" } },
          { id: "osm", type: "raster", source: "osm", paint: { "raster-opacity": 0.85, "raster-saturation": -0.35, "raster-brightness-max": 0.75 } },
        ],
      },
      center: [HOME.lng, HOME.lat],
      zoom: HOME.zoom,
      pitch: 45, // the live map runs pitched 3D — keep the vibe
      attributionControl: { compact: true },
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-left");

    // Category chips — the FIXED llx11 pin taxonomy. Each chip speaks the
    // same words a voice user would, so chips and voice share one router.
    var CHIP_UTTERANCES = {
      "Food": "food",
      "Offers": "deals",
      "Events": "events",
      "News": "news",
      "Accommodation": "accommodation",
      "Job-Offers": "jobs",
      "Fetch_Deliveries": "delivery",
    };
    var chipsEl = document.getElementById("chips");
    Object.keys(CHIP_UTTERANCES).forEach(function (cat) {
      var b = document.createElement("button");
      b.className = "chip";
      b.dataset.cat = cat;
      b.textContent = cat.replace(/_/g, " ").replace("Fetch Deliveries", "Deliveries");
      b.addEventListener("click", function () {
        if (b.classList.contains("active")) { LooperJarvis.bus.reset(); return; }
        LooperJarvis.ask(CHIP_UTTERANCES[cat]);
      });
      chipsEl.appendChild(b);
    });

    function highlightChip(cat) {
      Array.prototype.forEach.call(chipsEl.children, function (c) {
        c.classList.toggle("active", !!cat && c.dataset.cat === cat);
      });
    }

    map.on("load", function () {
      LooperJarvis.init({
        map: map,
        home: HOME,
        district: "Bondi",
        markerLib: maplibregl,
        // Served by the backend (/web/…) → same-origin, ANY port (Bill runs
        // 8010 locally — TypeDB owns 8000). Opened standalone → ?api=… or
        // the localhost default.
        apiBase: new URLSearchParams(location.search).get("api") ||
          (location.pathname.indexOf("/web/") === 0 ? location.origin : "http://localhost:8000"),
        onCategory: highlightChip,
      });
    });
  </script>
</body>
</html>
